[package]
name = "operations-control-center"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
domius-core = { path = "../../domius-core", features = ["wasm"] }
domius-web = { path = "../../domius-web" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document", "Element", "History", "Location", "Window"
] }
