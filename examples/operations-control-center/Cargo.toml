[package]
name = "operations-control-center"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
domius-core = { path = "../../domius-core", features = ["wasm"] }
domius-web = { path = "../../domius-web" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document", "Element", "Event", "EventTarget", "History", "HtmlElement",
    "HtmlSelectElement", "Location", "MouseEvent", "Node", "Window"
] }

[dev-dependencies]
js-sys = "0.3"
rqrr = { version = "0.10", default-features = false }
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
