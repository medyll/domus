[package]
name = "domius-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domius-core = { path = "../domius-core", features = ["wasm"] }
domius-macro = { path = "../domius-macro" }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "Node", "Text",
    "HtmlElement", "HtmlButtonElement", "HtmlInputElement", "HtmlImageElement",
    "SvgElement", "HtmlMediaElement", "MouseEvent", "MouseEventInit", "InputEvent", "FocusEvent",
    "KeyboardEvent", "KeyboardEventInit", "Event",
    "EventTarget", "DomTokenList", "NodeList", "HtmlCollection",
    "MutationObserver", "MutationObserverInit", "MutationRecord",
    "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit",
    "console", "Performance"
]}

[dev-dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
