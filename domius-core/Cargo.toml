[package]
name = "domius-core"
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic reactive runtime for Domus — signals, effects, scopes"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window"] }

[features]
serde = ["dep:serde"]
wasm = ["dep:wasm-bindgen", "dep:web-sys"]

[dev-dependencies]
